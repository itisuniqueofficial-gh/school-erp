# Production Docker Compose — School ERP + MySQL.
# Copy .env.example values into this file's environment or use an env_file.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-school_erp}
      MYSQL_USER: ${DB_USERNAME:-erp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-change-me-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?set APP_KEY (base64:...) in your environment}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-school_erp}
      DB_USERNAME: ${DB_USERNAME:-erp}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_CONNECT_RETRIES: "15"
      SESSION_SECURE_COOKIE: "false"
    volumes:
      - uploads:/var/www/html/storage/uploads

volumes:
  db_data:
  uploads:
